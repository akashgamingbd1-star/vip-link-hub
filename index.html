<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Telegram Links</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        body { 
            background: radial-gradient(circle at top left, #2e1065, #0f172a 70%);
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* 3D Floating Animation for Container */
        @keyframes floatCard {
            0% { transform: translateY(0px); box-shadow: 0 15px 35px rgba(147, 51, 234, 0.3); }
            50% { transform: translateY(-10px); box-shadow: 0 25px 45px rgba(168, 85, 247, 0.5); }
            100% { transform: translateY(0px); box-shadow: 0 15px 35px rgba(147, 51, 234, 0.3); }
        }

        .app-card { 
            background: rgba(38, 16, 65, 0.65); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(216, 180, 254, 0.2); 
            border-radius: 32px; 
            padding: 35px 24px; 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            animation: floatCard 4s ease-in-out infinite;
        }

        .profile-img-container { 
            width: 125px; 
            height: 125px; 
            margin: 0 auto 18px; 
            border-radius: 50%; 
            padding: 4px; 
            background: linear-gradient(135deg, #c084fc, #7e22ce); 
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.6); 
        }

        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            background-color: #1e1b4b; 
        }

        .title { 
            font-size: 22px; 
            font-weight: 800; 
            margin-bottom: 6px; 
            background: linear-gradient(90deg, #ffffff, #e9d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { 
            font-size: 13px; 
            color: #c084fc; 
            margin-bottom: 28px; 
            font-weight: 500;
        }

        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        /* Realistic 3D Raised Buttons */
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 16px; 
            border-radius: 20px; 
            text-decoration: none; 
            color: #fff; 
            font-size: 15px; 
            font-weight: 700; 
            position: relative;
            transition: all 0.2s ease;
        }

        .btn-primary { 
            background: linear-gradient(135deg, #9333ea, #6b21a8); 
            box-shadow: 0 6px 0px #4c1d95, 0 10px 20px rgba(147, 51, 234, 0.4);
            border: 1px solid #c084fc;
        }

        .btn-secondary { 
            background: linear-gradient(135deg, #a855f7, #7e22ce); 
            box-shadow: 0 6px 0px #581c87, 0 10px 20px rgba(168, 85, 247, 0.4);
            border: 1px solid #e9d5ff;
        }

        .btn-admin-contact { 
            background: rgba(255, 255, 255, 0.05); 
            box-shadow: 0 5px 0px rgba(255, 255, 255, 0.1), 0 8px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(192, 132, 252, 0.3); 
            color: #e9d5ff;
        }

        /* 3D Press Down Effect */
        .btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 2px 0px #4c1d95, 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="profile-img-container">
            <img id="view-img" src="https://via.placeholder.com/125" alt="Profile" class="profile-img">
        </div>

        <h2 class="title" id="view-title">Official Earning Hub</h2>
        <p class="subtitle">দৈনিক ফ্রি ইনকাম ও অফার আপডেট পেতে জয়েন করুন</p>

        <div class="links-container">
            <a id="view-btn1-link" href="#" target="_blank" class="btn btn-primary">
                🚀 <span id="view-btn1-text">Main Telegram Channel</span>
            </a>
            <a id="view-btn2-link" href="#" target="_blank" class="btn btn-secondary">
                🔥 <span id="view-btn2-text">Backup Channel</span>
            </a>
            <a id="view-admin-link" href="#" target="_blank" class="btn btn-admin-contact">
                💬 <span>Contact Admin</span>
            </a>
        </div>
    </div>

    <script>
        const defaultData = {
            img: "https://via.placeholder.com/125",
            btn1Text: "Main Telegram Channel",
            btn1Link: "https://t.me/",
            btn2Text: "Backup Channel",
            btn2Link: "https://t.me/",
            adminLink: "https://t.me/"
        };

        function loadData() {
            const data = JSON.parse(localStorage.getItem("appData")) || defaultData;
            document.getElementById("view-img").src = data.img;
            document.getElementById("view-btn1-text").innerText = data.btn1Text;
            document.getElementById("view-btn1-link").href = data.btn1Link;
            document.getElementById("view-btn2-text").innerText = data.btn2Text;
            document.getElementById("view-btn2-link").href = data.btn2Link;
            document.getElementById("view-admin-link").href = data.adminLink;
        }

        loadData();
    </script>
</body>
</html>
