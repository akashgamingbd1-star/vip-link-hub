<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00aaff; margin-bottom: 20px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
        input:focus { border-color: #0088cc; outline: none; }
        .save-btn { background: linear-gradient(90deg, #0088cc, #00aaff); color: white; padding: 14px; width: 100%; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .save-btn:active { transform: scale(0.98); }
        .msg { margin-top: 12px; text-align: center; font-size: 13px; color: #4ade80; display: none; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>⚙️ Website Control Panel</h2>
        
        <div class="form-group">
            <label>Profile Image URL (প্রোফাইল ছবির লিঙ্ক):</label>
            <input type="text" id="input-img" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Channel 1 Name (প্রথম চ্যানেলের নাম):</label>
            <input type="text" id="input-btn1-text">
        </div>
        <div class="form-group">
            <label>Channel 1 Link (প্রথম চ্যানেলের লিঙ্ক):</label>
            <input type="text" id="input-btn1-link">
        </div>
        <div class="form-group">
            <label>Channel 2 Name (দ্বিতীয় চ্যানেলের নাম):</label>
            <input type="text" id="input-btn2-text">
        </div>
        <div class="form-group">
            <label>Channel 2 Link (দ্বিতীয় চ্যানেলের লিঙ্ক):</label>
            <input type="text" id="input-btn2-link">
        </div>
        <div class="form-group">
            <label>Admin Profile Link (এডমিন লিঙ্ক):</label>
            <input type="text" id="input-admin-link">
        </div>

        <button class="save-btn" onclick="saveData()">Update Website</button>
        <div id="msg" class="msg">✅ সফলভাবে আপডেট হয়েছে!</div>
    </div>

    <script>
        const defaultData = {
            img: "https://via.placeholder.com/120",
            btn1Text: "Main Telegram Channel",
            btn1Link: "https://t.me/",
            btn2Text: "Backup Channel",
            btn2Link: "https://t.me/",
            adminLink: "https://t.me/"
        };

        function loadAdminData() {
            const data = JSON.parse(localStorage.getItem("appData")) || defaultData;
            document.getElementById("input-img").value = data.img;
            document.getElementById("input-btn1-text").value = data.btn1Text;
            document.getElementById("input-btn1-link").value = data.btn1Link;
            document.getElementById("input-btn2-text").value = data.btn2Text;
            document.getElementById("input-btn2-link").value = data.btn2Link;
            document.getElementById("input-admin-link").value = data.adminLink;
        }

        function saveData() {
            const newData = {
                img: document.getElementById("input-img").value,
                btn1Text: document.getElementById("input-btn1-text").value,
                btn1Link: document.getElementById("input-btn1-link").value,
                btn2Text: document.getElementById("input-btn2-text").value,
                btn2Link: document.getElementById("input-btn2-link").value,
                adminLink: document.getElementById("input-admin-link").value
            };

            localStorage.setItem("appData", JSON.stringify(newData));
            
            const msg = document.getElementById("msg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 3000);
        }

        loadAdminData();
    </script>
</body>
</html>
