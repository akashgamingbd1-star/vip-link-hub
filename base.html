<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}NEXUS HOST{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <div class="brand-mark">N</div>
    <div><b>NEXUS HOST</b><small>PRIVATE BOT CLOUD</small></div>
  </a>
  <div class="top-actions">
    <span class="secure">● SECURE</span>
    <a class="logout" href="{{ url_for('logout') }}">Logout ↗</a>
  </div>
</header>
{% with messages = get_flashed_messages(with_categories=true) %}
<div class="toast-wrap">{% for cat,msg in messages %}<div class="toast {{cat}}">{{msg}}</div>{% endfor %}</div>
{% endwith %}
<main class="container">{% block content %}{% endblock %}</main>
<footer>Personal hosting control center · {{ max_bots }} bot slots · live monitoring</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
